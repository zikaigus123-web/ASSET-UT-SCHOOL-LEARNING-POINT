if(c==='value'||c==='residual_value')v=num(v);if(c==='acquired_date'&&v&&!/^\d{4}-\d{2}-\d{2}$/.test(v))v=null;o[c]=v??null}return o}).filter(o=>o.asset_name&&o.lp_code);
$('#pv').innerHTML=rows.length?`<b>${nf(rows.length)} baris valid</b> siap diimport dari "${esc(ws['!ref']?f.name:'')}". Contoh: ${esc(rows[0].asset_name)} (${esc(rows[0].lp_code)})`:'<span style="color:var(--bad)">Tidak ada baris valid. Pastikan kolom Area2 dan Asset Name terisi.</span>';$('#go').disabled=!rows.length}catch(x){$('#pv').innerHTML='<span style="color:var(--bad)">Gagal membaca file: '+esc(x.message)+'</span>'}};
$('#go').onclick=async()=>{const rep=$('#im').value==='replace';if(rep&&!confirm('Semua data aset saat ini akan DIHAPUS lalu diganti. Lanjutkan?'))return;const b=$('#go');b.disabled=true;
try{if(rep){const {error}=await sb.from('assets').delete().gt('id',0);if(error)throw error}
for(let i=0;i<rows.length;i+=500){$('#pv').textContent=`Mengunggah ${Math.min(i+500,rows.length)} / ${rows.length}…`;const {error}=await sb.from('assets').insert(rows.slice(i,i+500));if(error)throw error}
Object.keys(DISTINCT).forEach(k=>delete DISTINCT[k]);$('#pv').innerHTML=`<span style="color:var(--ok);font-weight:700">Selesai: ${nf(rows.length)} aset berhasil diimport.</span>`}catch(x){$('#pv').innerHTML='<span style="color:var(--bad)">Gagal: '+esc(x.message)+'</span>';b.disabled=false}}}
const rb={admin:'b-r',editor:'b-y',viewer:'b-n'},fld=(l,id,v='',ty='text')=>`<label style="display:block;font-weight:600;font-size:.85rem;margin-bottom:12px">${l}<input id="${id}" type="${ty}" class="inp" style="margin-top:4px" value="${esc(v)}" autocomplete="off" autocapitalize="none"></label>`,
rsel=v=>`<label style="display:block;font-weight:600;font-size:.85rem;margin-bottom:12px">Role<select id="fr" class="inp" style="margin-top:4px">${['admin','editor','viewer'].map(r=>`<option ${v===r?'selected':''}>${r}</option>`).join('')}</select></label>`;
async function usersView(){if(demo)return needSb();
const {data,error}=await sb.rpc('admin_list_users');if(error)throw error;
$('#ct').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap"><div class="note" style="margin:0;flex:1"><b>admin</b>: semua akses + kelola user · <b>editor</b>: edit matrix & import data · <b>viewer</b>: hanya melihat</div><button class="btn pri" id="au"><i class="ph ph-user-plus"></i> Tambah user</button></div>
<div class="tw"><table><thead><tr><th>Username</th><th>Nama</th><th>Role</th><th>Status</th><th>Login terakhir</th><th>Aksi</th></tr></thead><tbody>${data.map(u=>`<tr><td><b>${u.username?'@'+esc(u.username):'<span style="color:var(--mut)">(tanpa username)</span>'}</b></td><td>${esc(u.full_name)}</td><td><span class="badge ${rb[u.role]}">${u.role}</span></td><td><span class="badge ${u.active?'b-g':'b-n'}">${u.active?'Aktif':'Nonaktif'}</span></td><td>${u.last_sign_in_at?new Date(u.last_sign_in_at).toLocaleString('id-ID'):'–'}</td><td style="white-space:nowrap"><button class="btn gh" data-e="${u.id}">Edit</button> <button class="btn gh" data-p="${u.id}">Reset PW</button> <button class="btn gh" data-d="${u.id}" style="color:var(--bad)">Hapus</button></td></tr>`).join('')}</tbody></table></div>`;
const U=id=>data.find(u=>u.id===id),call=async(fn,a,b)=>{b.disabled=true;const {error}=await sb.rpc(fn,a);if(error){b.disabled=false;return alert(error.message)}$('#dr').innerHTML='';go('users')};
$('#au').onclick=()=>{modal('Tambah user',fld('Username (huruf kecil, angka, . _ -)','fu')+fld('Nama lengkap','fn')+fld('Password (min. 8 karakter)','fp','','password')+rsel('viewer')+'<button class="btn pri" id="sv" style="width:100%">Buat user</button>');
$('#sv').onclick=e=>call('admin_create_user',{p_username:$('#fu').value,p_password:$('#fp').value,p_name:$('#fn').value,p_role:$('#fr').value},e.target)};
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const u=U(b.dataset.e);modal('Edit @'+esc(u.username||u.full_name),fld('Nama lengkap','fn',u.full_name)+rsel(u.role)+`<label style="display:flex;gap:8px;align-items:center;margin-bottom:16px"><input type="checkbox" id="fa" ${u.active?'checked':''}> Akun aktif</label><button class="btn pri" id="sv" style="width:100%">Simpan</button>`);
$('#sv').onclick=e=>call('admin_update_user',{p_id:u.id,p_name:$('#fn').value,p_role:$('#fr').value,p_active:$('#fa').checked},e.target)});
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const u=U(b.dataset.p);modal('Reset password @'+esc(u.username||u.full_name),fld('Password baru (min. 8 karakter)','fp','','password')+'<button class="btn pri" id="sv" style="width:100%">Reset password</button>');
$('#sv').onclick=e=>call('admin_reset_password',{p_id:u.id,p_password:$('#fp').value},e.target)});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const u=U(b.dataset.d);if(confirm('Hapus user @'+(u.username||u.full_name)+'? Tindakan ini tidak bisa dibatalkan.'))call('admin_delete_user',{p_id:u.id},b)})}
boot();
</script></body></html>
