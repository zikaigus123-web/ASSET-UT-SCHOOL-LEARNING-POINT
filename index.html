<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UT School • Infrastructure Standardization</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--ut:#FDB913;--ut-d:#F59E0B;--ink:#17163A;--ink2:#2B2A55;--bg:#F6F5FB;--card:#fff;--line:#EAE8F4;--mut:#757394;--ok:#10B981;--bad:#F43F5E;--warn:#F59E0B;--vio:#6C5CE7;--vio-d:#4F46E5;--teal:#14B8A6;--sky:#3B82F6;--sh:0 1px 2px #1e1b4b0a,0 10px 30px #1e1b4b0f;--r:22px;--fh:'Plus Jakarta Sans',Inter,system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(620px 420px at 88% -6%,#fdb91338,transparent 70%),radial-gradient(720px 520px at -6% 22%,#6c5ce72e,transparent 70%),radial-gradient(640px 520px at 100% 100%,#14b8a62b,transparent 70%)}
button,input,select{font:inherit}
h2,h3,.kpi b,.hero h1,.hb h1,.ring b{font-family:var(--fh)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#d5d2ea;border-radius:99px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}

/* buttons & inputs */
.btn{border:0;border-radius:12px;padding:.62rem 1.05rem;font-weight:700;cursor:pointer;display:inline-flex;gap:.45rem;align-items:center;justify-content:center;transition:.18s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.pri{background:linear-gradient(135deg,#FDB913,#FF9F1C);color:var(--ink);box-shadow:0 6px 16px #fdb9404d}.pri:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 22px #fdb94066}
.gh{background:#fff;border:1px solid var(--line);color:var(--ink)}.gh:hover:not(:disabled){background:#faf9ff;border-color:#d8d5ee}
.inp{width:100%;padding:.7rem .95rem;border:1px solid #E4E1F2;border-radius:14px;background:#fff;min-height:44px;color:var(--ink);transition:.15s}
.inp:hover{border-color:#cfcbe8}.inp:focus{outline:4px solid #6c5ce724;border-color:var(--vio)}
.btn:focus-visible,.nav:focus-visible,.nav2:focus-visible{outline:3px solid #6c5ce744;outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:#fff}
.hero{background:radial-gradient(520px 420px at 95% 0%,#fdb913b3,transparent 65%),radial-gradient(520px 520px at 0% 100%,#14b8a666,transparent 65%),linear-gradient(135deg,#1E1B4B,#3730A3 60%,#6D28D9);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;border-radius:0 44px 44px 0}
.hero:before{content:"";position:absolute;right:-90px;top:-90px;width:340px;height:340px;border-radius:50%;background:linear-gradient(135deg,#FDB913,#FF7A59);opacity:.95}
.hero:after{content:"";position:absolute;right:70px;bottom:-140px;width:300px;height:300px;border-radius:50%;border:36px solid #ffffff14}
.hero>*{position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:12px;font-weight:800}
.mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#FDB913,#FF9F1C);color:var(--ink);display:grid;place-items:center;font-weight:800;box-shadow:0 8px 20px #fdb94055}
.hero h1{font-size:46px;line-height:1.08;margin:0 0 16px;max-width:480px;letter-spacing:-.03em}.hero h1 span{color:var(--ut)}.hero p{color:#cfcdf5;max-width:430px;line-height:1.6}
.stats{display:flex;gap:14px;flex-wrap:wrap}.stats>div{background:#ffffff14;border:1px solid #ffffff2b;backdrop-filter:blur(8px);padding:14px 20px;border-radius:18px;min-width:110px}
.stats b{display:block;font-size:26px;color:var(--ut);font-family:var(--fh)}.stats small{color:#cfcdf5}
.lform{display:flex;align-items:center;justify-content:center;padding:32px}.lform form{width:100%;max-width:400px}
.lform h2{letter-spacing:-.02em}
.err{background:#FFE1E6;color:#BE123C;padding:.75rem .9rem;border-radius:12px;font-size:.85rem;font-weight:600;margin-top:12px}
.eye{position:absolute;right:14px;bottom:12px;cursor:pointer;color:var(--mut);font-size:1.15rem}

/* shell */
.app{display:flex;min-height:100vh}
.side{width:256px;position:fixed;top:14px;bottom:14px;left:14px;background:radial-gradient(260px 180px at 0% 0%,#6c5ce755,transparent 70%),radial-gradient(220px 180px at 100% 100%,#fdb91328,transparent 70%),linear-gradient(170deg,#241F5C,#17163A 75%);color:#c9c7ee;display:flex;flex-direction:column;z-index:40;border-radius:28px;box-shadow:0 24px 50px #1e1b4b45;transition:width .22s ease,transform .22s ease}
.side .logo{padding:22px 20px;color:#fff;border-bottom:1px solid #ffffff14}
.side nav{padding:6px 12px;flex:1;overflow:auto}
.nl{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:#7f7cb0;font-weight:700;padding:16px 12px 6px;white-space:nowrap}
.nav,.nav2{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;color:#b5b2e0;padding:.74rem .9rem;border-radius:14px;cursor:pointer;font-weight:600;margin-bottom:3px;white-space:nowrap;transition:.18s;position:relative}
.nav:hover,.nav2:hover{background:#ffffff14;color:#fff}
.nav.on{background:linear-gradient(135deg,#FDB913,#FF9F1C);color:var(--ink);box-shadow:0 8px 20px #fdb94040}
.nav i,.nav2 i{font-size:20px;flex:none;transition:transform .22s}
.user{padding:16px;border-top:1px solid #ffffff14;display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#FDB913,#FF7A59);color:var(--ink);display:grid;place-items:center;font-weight:800;flex:none}
.main{flex:1;margin-left:284px;min-width:0;transition:margin-left .22s ease}
.top{position:sticky;top:0;background:#f6f5fbbf;backdrop-filter:blur(14px);padding:16px 32px;display:flex;align-items:center;gap:14px;z-index:30}
.top h2{margin:0;font-size:1.4rem;line-height:1.2;letter-spacing:-.02em}
.top h2 small{display:block;font-size:.8rem;font-weight:500;color:var(--mut);margin-top:3px;letter-spacing:0;font-family:Inter,sans-serif}
.burger{display:inline-flex!important;padding:.55rem .7rem}
.content{padding:8px 32px 56px;max-width:1560px}
.content>*{animation:rise .35s ease both}.content>*:nth-child(2){animation-delay:.05s}.content>*:nth-child(3){animation-delay:.1s}.content>*:nth-child(4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
#sbk{display:none;position:fixed;inset:0;background:#17163a77;backdrop-filter:blur(2px);z-index:39}.side.open+#sbk{display:block}

/* badges */
.badge{display:inline-block;padding:.22rem .65rem;border-radius:99px;font-size:.72rem;font-weight:700;white-space:nowrap}
.b-y{background:#FFF1CC;color:#9A6700}.b-g{background:#D9F6EA;color:#047857}.b-r{background:#FFE1E6;color:#BE123C}.b-n{background:#ECEBF6;color:#5B5980}.b-o{background:#FFE8D1;color:#B45309}

/* KPI cards: each one gets its own color */
.kpis{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.kpi{--c:#D97706;--cb:#FFF1CC;position:relative;overflow:hidden;isolation:isolate;cursor:pointer;transition:.2s;padding:20px;animation:rise .4s ease both}
.kpi:nth-child(5n+2){--c:#5B4BD5;--cb:#ECE9FF}
.kpi:nth-child(5n+3){--c:#0D9488;--cb:#D5F5F0}
.kpi:nth-child(5n+4){--c:#2563EB;--cb:#DCE8FF}
.kpi:nth-child(5n+5){--c:#E11D48;--cb:#FFE1E6}
.kpi:nth-child(2){animation-delay:.04s}.kpi:nth-child(3){animation-delay:.08s}.kpi:nth-child(4){animation-delay:.12s}.kpi:nth-child(5){animation-delay:.16s}
.kpi:after{content:"";position:absolute;right:-36px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:var(--cb);z-index:-1;opacity:.85}
.kpi:hover{box-shadow:0 18px 40px #1e1b4b1a;transform:translateY(-3px)}
.kpi small{color:var(--mut);font-weight:600;font-size:.82rem;display:block;padding-right:46px}
.kpi b{display:block;font-size:2rem;margin-top:8px;letter-spacing:-.03em;line-height:1.1}
.kpi span{font-size:.78rem;color:var(--mut);display:block;margin-top:4px}
.kic{position:absolute;right:16px;top:16px;width:40px;height:40px;border-radius:13px;background:var(--cb);color:var(--c);display:grid;place-items:center;font-size:1.25rem}

/* dashboard hero */
.hb{position:relative;overflow:hidden;border-radius:30px;padding:30px 36px;color:#fff;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;background:radial-gradient(440px 300px at 100% 0%,#fdb913cc,transparent 60%),radial-gradient(380px 300px at 40% 125%,#14b8a666,transparent 65%),linear-gradient(120deg,#1E1B4B 0%,#3730A3 55%,#7C3AED 100%);box-shadow:0 24px 50px #4338ca3d;margin-bottom:18px}
.hb:after{content:"";position:absolute;right:170px;top:-80px;width:210px;height:210px;border-radius:50%;border:26px solid #ffffff12;pointer-events:none}
.hb>*{position:relative;z-index:1}
.hb-k{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#FDE08A}
.hb h1{margin:6px 0 6px;font-size:1.95rem;letter-spacing:-.025em;line-height:1.15}
.hb p{margin:0 0 18px;color:#d6d4fb;max-width:540px;font-size:.92rem;line-height:1.55}
.hb-f{display:flex;gap:10px;flex-wrap:wrap}
.hb-f .inp{width:auto;min-width:190px;background:#ffffff1f;border:1px solid #ffffff40;color:#fff;backdrop-filter:blur(6px)}
.hb-f .inp option{color:#17163A}.hb-f .inp:focus{outline:4px solid #ffffff2e;border-color:#fff}
.hb-c{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hb-c span{background:#ffffff1a;border:1px solid #ffffff2b;padding:.38rem .85rem;border-radius:99px;font-size:.78rem;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.ring{--p:0;width:156px;height:156px;border-radius:50%;background:conic-gradient(#FDB913 calc(var(--p)*1%),#ffffff26 0);display:grid;place-items:center;box-shadow:0 0 0 9px #ffffff10}
.ring>div{width:122px;height:122px;border-radius:50%;background:#2B2780;display:grid;place-content:center;text-align:center}
.ring b{font-size:1.9rem;letter-spacing:-.03em}.ring small{font-size:.68rem;color:#cfcdf5;font-weight:600}

.grid2{display:grid;gap:18px;grid-template-columns:2fr 1fr;margin-top:18px}.grid3{display:grid;gap:18px;grid-template-columns:1fr 1fr;margin-top:18px}
.cv{position:relative;height:300px}
h3{margin:0 0 14px;font-size:1rem;font-weight:700;letter-spacing:-.01em}

/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--sh)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.84rem}
th{background:#F8F7FD;text-align:left;padding:.85rem .9rem;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);position:sticky;top:0;white-space:nowrap;z-index:1}
td{padding:.78rem .9rem;border-top:1px solid #F0EEF8}
tbody tr:hover td{background:#FBFAFF}tr.cl{cursor:pointer}tr.cl:hover td{background:#FFF9E8}
.bar{height:8px;background:#EFEDF8;border-radius:9px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#FDB913,#FF9F1C);border-radius:9px;transition:width .6s ease}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.filters>*{flex:1;min-width:150px}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:.85rem;color:var(--mut)}

/* overlays */
.drawer{position:fixed;right:12px;top:12px;bottom:12px;width:min(480px,calc(100vw - 24px));background:#fff;z-index:60;padding:26px;overflow:auto;box-shadow:-20px 0 60px #1e1b4b3d;border-radius:28px;animation:slide .25s ease both}
@keyframes slide{from{opacity:0;transform:translateX(30px)}}
.ov{position:fixed;inset:0;background:#17163a80;backdrop-filter:blur(3px);z-index:55}
.md{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,94vw);max-height:86vh;overflow:auto;background:#fff;border-radius:26px;padding:24px;z-index:60;box-shadow:0 30px 80px #1e1b4b55}
.note{background:linear-gradient(135deg,#FFF8E1,#FFF1F0);border:1px solid #FFE3A3;border-radius:16px;padding:13px 16px;font-size:.85rem;margin-bottom:16px;line-height:1.5}
.empty{padding:44px;text-align:center;color:var(--mut)}
.lr{display:flex;align-items:center;gap:12px;padding:.7rem .6rem;border-top:1px solid #F0EEF8;cursor:pointer;border-radius:12px;transition:.15s}.lr:hover{background:#FFF9E8}.lr .bar{flex:1}

/* map */
#map{background:#ececf4;height:420px;border-radius:20px;z-index:1}.leaflet-tile-pane{filter:grayscale(.7) contrast(.92) brightness(1.05)}
.leg{display:flex;gap:16px;font-size:.78rem;color:var(--mut);margin-top:12px}.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;border:2px solid #fff;box-shadow:0 0 0 1px #d7d4ea}

/* matrix helpers */
.mxw{max-height:72vh}.mxt th,.mxt td{white-space:nowrap}.mxt .sk{position:sticky;left:0;background:#fff;z-index:2;min-width:230px}.mxt th.sk{background:#F8F7FD;z-index:3}
td.mx{text-align:center;font-weight:800;min-width:46px;border-left:1px solid var(--line)}td.mp{background:#FFF1CC;color:#9A6700}td.mr{background:#FFE1E6;color:#BE123C}.mxe td.mx{cursor:pointer}.mxe td.mx:hover{outline:2px solid var(--ut);outline-offset:-2px}
tr.cg td{background:var(--ink);color:var(--ut);font-weight:700;font-size:.75rem;text-transform:uppercase}

/* skeleton & toast */
.skl{border-radius:var(--r);background:linear-gradient(90deg,#ebe9f6 25%,#f6f5fb 37%,#ebe9f6 63%);background-size:400% 100%;animation:shim 1.2s infinite}@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}
#ts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--ink);color:#fff;padding:.85rem 1.1rem;border-radius:14px;font-size:.88rem;font-weight:600;box-shadow:0 12px 32px #1e1b4b55;border-left:4px solid var(--ut);max-width:360px;animation:rise .2s both;transition:.3s}.toast.out{opacity:0;transform:translateY(6px)}

/* ===== data pages ===== */
.dt{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:var(--sh)}
.dt .sr{position:relative;flex:2;min-width:220px}.dt .sr i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:1.1rem}
.dt .sr .inp{padding-left:42px;border-color:transparent;background:#F6F5FB}
.dt select.inp{flex:1;min-width:150px;max-width:240px;border-color:transparent;background:#F6F5FB}
.dt .inp:focus{background:#fff}
.seg{display:inline-flex;background:#F6F5FB;border-radius:14px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:.5rem .9rem;border-radius:11px;font-weight:700;font-size:.82rem;color:var(--mut);cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:.15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px #1e1b4b14}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chp{border:1px solid var(--line);background:#fff;border-radius:99px;padding:.45rem .95rem;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--ink2);display:inline-flex;gap:7px;align-items:center;transition:.15s}
.chp i.d{width:9px;height:9px;border-radius:50%;background:var(--dc,#94A3B8)}
.chp:hover{border-color:#cfcbe8;transform:translateY(-1px)}.chp.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cnt{margin-left:auto;font-size:.82rem;color:var(--mut);font-weight:600;padding:0 8px}
.cg{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.tag{background:#F6F5FB;color:var(--ink2);border-radius:9px;padding:.24rem .58rem;font-size:.7rem;font-weight:600;display:inline-flex;gap:5px;align-items:center;max-width:100%}
.tag i{color:var(--mut)}

/* Learning Point cards */
.lc{--c:#10B981;background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px 20px 18px;box-shadow:var(--sh);cursor:pointer;transition:.2s;position:relative;overflow:hidden;animation:rise .35s ease both}
.lc:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
.lc:hover{transform:translateY(-4px);box-shadow:0 20px 44px #1e1b4b1f}
.lc.m{--c:#F59E0B}.lc.l{--c:#F43F5E}
.lc-h{display:flex;gap:14px;align-items:center}
.rg{--p:0;flex:none;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#EFEDF8 0);display:grid;place-items:center}
.rg b{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.84rem;font-family:var(--fh)}
.lc h4{margin:0;font-size:1.05rem;font-family:var(--fh);letter-spacing:-.01em;line-height:1.25}.lc .sub{font-size:.76rem;color:var(--mut);margin-top:3px}
.lc-b{margin:18px 0 4px;display:grid;gap:12px}
.lc-b .t{display:flex;justify-content:space-between;font-size:.76rem;color:var(--mut);font-weight:600;margin-bottom:5px}.lc-b .t b{color:var(--ink)}
.lc-s{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.lc-s>div{background:#F8F7FD;border-radius:14px;padding:9px 10px;text-align:center}.lc-s b{display:block;font-size:1.05rem;font-family:var(--fh)}.lc-s small{font-size:.66rem;color:var(--mut);font-weight:600}

/* Asset cards */
.ac{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px;transition:.2s;animation:rise .3s ease both}
.ac:hover{transform:translateY(-3px);box-shadow:0 16px 36px #1e1b4b1a}
.ac-t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:1.4rem;background:var(--cb,#ECE9FF);color:var(--c,#5B4BD5);flex:none}
.ac h4{margin:0;font-size:.93rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:700}
.ac .code{font-size:.72rem;color:var(--mut);font-family:ui-monospace,Menlo,monospace;margin-top:4px}
.ac-m{display:flex;gap:6px;flex-wrap:wrap}
.ac-f{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;border-top:1px dashed #E4E1F2}
.ac-f b{font-family:var(--fh);font-size:1.02rem}.ac-f small{color:var(--mut);font-size:.72rem;font-weight:600}

/* Gap cards */
.gc{--c:#10B981;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px 22px;box-shadow:var(--sh);cursor:pointer;transition:.2s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;animation:rise .3s ease both}
.gc:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:5px;border-radius:0 6px 6px 0;background:var(--c)}
.gc:hover{transform:translateY(-3px);box-shadow:0 16px 36px #1e1b4b1a}
.gc.w{--c:#F59E0B}.gc.b{--c:#F43F5E}.gc.v{--c:#6C5CE7}
.gc-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.gc h4{margin:0;font-size:.98rem;line-height:1.35;font-family:var(--fh)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp>div{border-radius:14px;padding:10px 12px;background:#F8F7FD;display:flex;gap:10px;align-items:center}
.cmp i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:1rem;flex:none}

async function standardsView(){if(demo)return needSb();const sx=st.sx=st.sx||{tab:'items',c:'',q:''};
const T=[['items','Standar per item'],['lp','Kelas Learning Point'],['log','Riwayat perubahan']];
$('#ct').innerHTML=`<div class="filters" style="max-width:640px">${T.map(x=>`<button class="btn ${sx.tab===x[0]?'pri':'gh'}" data-t="${x[0]}">${x[1]}</button>`).join('')}</div><div id="sb"></div>`;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sx.tab=b.dataset.t;standardsView()});
await({items:sxItems,lp:sxLP,log:sxLog}[sx.tab])(sx)}
async function sxItems(sx){const it=await allRows('standard_items','*',['no']),cats=[...new Set(it.map(i=>i.category))];
$('#sb').innerHTML=`<div class="kpis" id="sk" style="margin-bottom:16px"></div><div class="filters"><input class="inp" id="sq" placeholder="Cari item…" value="${esc(sx.q)}" style="flex:2"><select class="inp" id="sc"><option value="">Semua kategori</option>${cats.map(c=>`<option ${sx.c===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="btn pri" id="ai" style="flex:0 0 auto"><i class="ph ph-plus"></i> Tambah item</button></div>
<div class="note">Centang = item <b>wajib</b> untuk kelas tersebut. Perubahan tersimpan langsung dan <b>otomatis mengubah</b> Matrix, Gap Standar, dan kesiapan semua LP di kelas itu. Untuk menghapus item dari standar, hilangkan semua centang (data tidak hilang). Nama item tidak bisa diubah karena terhubung ke mapping aset.</div>
<div class="tw mxw"><table><thead><tr><th>No</th><th>Kategori</th><th>Item</th><th style="text-align:center">Kelas A</th><th style="text-align:center">Kelas B</th><th style="text-align:center">Kelas C</th></tr></thead><tbody id="sbd"></tbody></table></div>`;
const kp=()=>{$('#sk').innerHTML=['a','b','c'].map(k=>`<div class="card kpi"><small>Item wajib Kelas ${k.toUpperCase()}</small><b>${it.filter(i=>i['std_'+k]>0).length}</b><span>dari ${it.length} item</span></div>`).join('')};
const draw=()=>{const rows=it.filter(i=>(!sx.c||i.category===sx.c)&&i.item.toLowerCase().includes(sx.q));
$('#sbd').innerHTML=rows.map(i=>`<tr><td>${i.no}</td><td>${esc(i.category)}</td><td><b>${esc(i.item)}</b> ${!(i.std_a||i.std_b||i.std_c)?'<span class="badge b-n">Tidak dipakai</span>':''}</td>${['a','b','c'].map(k=>`<td style="text-align:center"><input type="checkbox" data-n="${i.no}" data-k="${k}" ${i['std_'+k]>0?'checked':''} style="width:18px;height:18px;accent-color:#E5A100;cursor:pointer"></td>`).join('')}</tr>`).join('')||'<tr><td colspan="6" class="empty">Tidak ada item.</td></tr>';
document.querySelectorAll('#sbd input').forEach(c=>c.onchange=async()=>{const i=it.find(x=>x.no==c.dataset.n),k='std_'+c.dataset.k,v=c.checked?1:0;c.disabled=true;
const {error}=await sb.from('standard_items').update({[k]:v}).eq('no',i.no);c.disabled=false;if(error){c.checked=!c.checked;return alert('Gagal menyimpan: '+error.message)}i[k]=v;kp();draw()})};
kp();draw();$('#sq').oninput=e=>{sx.q=e.target.value.toLowerCase();draw()};$('#sc').onchange=e=>{sx.c=e.target.value;draw()};
$('#ai').onclick=()=>{modal('Tambah item standar',`<label style="display:block;font-weight:600;font-size:.85rem;margin-bottom:12px">Kategori<select id="nc" class="inp" style="margin-top:4px">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label style="display:block;font-weight:600;font-size:.85rem;margin-bottom:12px">Atau kategori baru<input id="nk" class="inp" style="margin-top:4px" placeholder="(kosongkan jika memakai kategori di atas)"></label><label style="display:block;font-weight:600;font-size:.85rem;margin-bottom:12px">Nama item<input id="ni" class="inp" style="margin-top:4px"></label><div style="display:flex;gap:18px;margin-bottom:16px">${['a','b','c'].map(k=>`<label><input type="checkbox" id="nn${k}" style="accent-color:#E5A100"> Kelas ${k.toUpperCase()}</label>`).join('')}</div><button class="btn pri" id="sv" style="width:100%">Tambah</button>`);
$('#sv').onclick=async e=>{const name=$('#ni').value.trim();if(!name)return alert('Nama item wajib diisi');if(it.some(x=>x.item.toLowerCase()===name.toLowerCase()))return alert('Item dengan nama ini sudah ada');e.target.disabled=true;
const {error}=await sb.from('standard_items').insert({no:Math.max(...it.map(x=>x.no))+1,category:$('#nk').value.trim()||$('#nc').value,item:name,std_a:+$('#nna').checked,std_b:+$('#nnb').checked,std_c:+$('#nnc').checked});if(error){e.target.disabled=false;return alert(error.message)}$('#dr').innerHTML='';standardsView()}}}
async function sxLP(){const lp=await getLP();$('#sb').innerHTML=`<div class="note">Kelas menentukan standar item yang wajib. Mengubah kelas LP langsung mengubah item wajib, Matrix, Gap, dan kesiapannya.</div><div class="tw"><table><thead><tr><th>Learning Point</th><th>Region</th><th>Kelas</th><th>Item wajib</th><th>Kesiapan matrix</th></tr></thead><tbody>${lp.map(l=>`<tr><td><b>${esc(l.name)}</b> <small style="color:var(--mut)">${l.code}</small></td><td>${esc(l.region)}</td><td><select class="inp" data-c="${l.code}" style="max-width:100px">${['A','B','C'].map(k=>`<option ${l.class===k?'selected':''}>${k}</option>`).join('')}</select></td><td>${l.req}</td><td>${l.rm}%</td></tr>`).join('')}</tbody></table></div>`;
document.querySelectorAll('select[data-c]').forEach(s=>s.onchange=async()=>{s.disabled=true;const {error}=await sb.from('learning_points').update({class:s.value}).eq('code',s.dataset.c);if(error){alert(error.message)}standardsView()})}
async function sxLog(){const [{data:lg,error},{data:pr}]=await Promise.all([sb.from('standard_changes').select('*').order('at',{ascending:false}).limit(150),sb.from('profiles').select('id,full_name,username')]);if(error)throw error;
const nm=Object.fromEntries((pr||[]).map(p=>[p.id,p.username?'@'+p.username:p.full_name])),K={standar:'Standar item',item_ditambah:'Item ditambah',kelas_lp:'Kelas LP'};
$('#sb').innerHTML=`<div class="tw"><table><thead><tr><th>Waktu</th><th>Oleh</th><th>Jenis</th><th>Target</th><th>Perubahan</th></tr></thead><tbody>${lg.map(r=>`<tr><td>${new Date(r.at).toLocaleString('id-ID')}</td><td>${esc(nm[r.by]||'–')}</td><td><span class="badge b-y">${K[r.kind]||r.kind}</span></td><td>${esc(r.target)}</td><td>${esc(r.field)}: ${r.old_value!=null?esc(r.old_value)+' → ':''}<b>${esc(r.new_value)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada perubahan.</td></tr>'}</tbody></table></div>`}
function toast(m){let c=$('#ts');if(!c){c=document.createElement('div');c.id='ts';document.body.appendChild(c)}const d=document.createElement('div');d.className='toast';d.textContent=m;c.appendChild(d);setTimeout(()=>d.classList.add('out'),3600);setTimeout(()=>d.remove(),4000)}
window.alert=m=>toast(String(m));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#dr'))$('#dr').innerHTML=''});
boot();
</script></body></html>
